name: queue-branch-proof
on:
  push:
    branches: ['mergify/**', 'main']
  pull_request:
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "event=${{ github.event_name }} ref=${{ github.ref }}"
      - env:
          S: ${{ secrets.QUEUE_CANARY }}
        run: |
          echo "secret readable: ${S:+yes}"
          echo "secret length: ${#S}"
